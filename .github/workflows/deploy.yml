name: Manual Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Тег образа (по умолчанию latest)'
        type: string
        default: 'latest'
      prune_after:
        description: 'docker system prune после деплоя'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/memes-bot
  DOCKER_COMPOSE_FILE: docker-compose.prod.yml
  REMOTE_DIR: /home/${{ secrets.VPS_USER }}/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure target dir exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p "${{ env.REMOTE_DIR }}"

      - name: Upload compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ${{ env.DOCKER_COMPOSE_FILE }}
          target: ${{ env.REMOTE_DIR }}/
          strip_components: 0
          overwrite: true
          debug: true

      - name: Write .env on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            umask 077
            cat > "${{ env.REMOTE_DIR }}/.env" <<'EOF'
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            NODE_ENV=${{ secrets.NODE_ENV }}
            OWNER_ID=${{ secrets.OWNER_ID }}
            DEEPSEEK_TOKEN=${{ secrets.DEEPSEEK_TOKEN }}
            DEEPSEEK_URL=${{ secrets.DEEPSEEK_URL }}
            DEEPSEEK_MODEL=${{ secrets.DEEPSEEK_MODEL }}
            CONTEXT_TTL_HOURS=${{ secrets.CONTEXT_TTL_HOURS }}
            CONTEXT_MAX_TURNS=${{ secrets.CONTEXT_MAX_TURNS }}
            EXCLUDE_USER_FOR_KEYWORDS=${{ secrets.EXCLUDE_USER_FOR_KEYWORDS }}
            EOF

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ env.REMOTE_DIR }}"
            docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_TOKEN }}
            IMAGE_TAG='${{ inputs.image_tag }}'
            [ -z "$IMAGE_TAG" ] && IMAGE_TAG=latest
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} pull
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} down
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} up -d --remove-orphans

            if [ "${{ inputs.prune_after }}" = "true" ]; then
              docker system prune -af || true
            fi
